[package]
name = "runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `rlib` for the in-process JIT (the `backend` crate links it as a normal
# dependency); `staticlib` for native `otter_fusion build` output, where the system
# linker links the emitted object against `libruntime.a`.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
getrandom = "0.2"
libc = "0.2"

# Compiles the worker-panic-isolation setjmp/longjmp shim (src/panic_boundary.c).
[build-dependencies]
cc = "1"
