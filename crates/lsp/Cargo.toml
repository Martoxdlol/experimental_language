[package]
name = "lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "otter_fusion_lsp"
path = "src/main.rs"

[dependencies]
compiler.workspace = true
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
dashmap = "6"
serde_json = "1"
